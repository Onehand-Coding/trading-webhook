name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      BINANCE_API_KEY: test-api-key
      BINANCE_SECRET_KEY: test-secret-key
      WEBHOOK_SECRET: test-webhook-secret
      FLASK_ENV: testing
      FLASK_DEBUG: "False"
      LOG_LEVEL: ERROR
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Test
        run: uv run pytest

      - name: Build wheel
        run: uv build

      - name: Check wheel contents
        run: python -m zipfile -l dist/*.whl | grep trading_webhook/webhook.py
