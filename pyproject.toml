[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trading-webhook"
version = "0.1.0"
description = "Automated trading webhook server"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "Onehand-Coding", email = "onehand.coding433@gmail.com" },
]
dependencies = [
    "flask>=3.0.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
    "gunicorn>=23.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/trading_webhook"]

[project.optional-dependencies]
dev = [
    "pytest>=8.4",
    "pytest-mock>=3.14",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[project.scripts]
run-webhook = "trading_webhook.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 88
target-version = "py38"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["trading_webhook"]
